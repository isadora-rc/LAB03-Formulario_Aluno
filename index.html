<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DevTech Academy - Cadastro de Alunos</title>

    <link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Cadastro de Alunos</h1>


        <form id="formAluno">
            <div class="mb-3">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="curso">Curso:</label>
                <select id="curso" class="form-control">
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="notaFinal">Nota Final:</label>
                <input type="number" id="notaFinal" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>

        <!-- tabela -->
        <h2 class="mt-5">Lista de Alunos</h2>
        <table class="table table-bordered mt-3" id="tabelaAlunos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Curso</th>
                    <th>Nota Final</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- ---------- -->
            </tbody>
        </table>
    </div>

    <script src="js/bootstrap.js"></script>

    <script src="script.js"></script>
</body>
</html>
